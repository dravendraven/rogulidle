<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogulidle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header>
    <h1>Rogulidle</h1>
    <div class="controls">
      <button id="lab" type="button">🧪 lab</button>
      <button id="playPause" type="button">⏸ pause</button>
      <button id="speed" type="button">1×</button>
      <button id="debug" type="button">🔎 debug</button>
      <button id="resetSession" type="button">↻ reset</button>
    </div>
  </header>

  <!-- Three columns, and the board is the middle one. The two flanks are
       equal fractions, so the simulation stays centred on the page whether
       the lab is open or shut — which is the whole reason this is a grid and
       not the flex row it used to be. -->
  <div class="lab">
    <div class="side">
      <!-- WHO IS PLAYING, one block: the choice and what it means. Outside
           #dials on purpose — the dials hide, and the most important control
           on the page must not hide with them. -->
      <div id="roster" class="roster"></div>
      <div class="dials" id="dials" hidden></div>
    </div>

    <div class="middle">
      <main>
        <div id="stage" class="stage">
          <!-- Above the board and inside its frame, the mirror of the hp bar
               below it: how deep, then the floor, then what it costs. -->
          <div id="floor" class="floor-bar"></div>
          <div id="grid" class="grid"></div>
          <div id="summary" class="summary">
            <div id="summaryTitle" class="summary-title"></div>
            <div id="summaryBody"></div>
          </div>
          <div id="coinPopup" class="coin-popup"></div>
          <div id="shop" class="summary">
            <div class="summary-title">shop</div>
            <div id="shopBalance" class="shop-balance"></div>
            <div id="shopItems" class="shop-items"></div>
            <button id="shopSkip" type="button">skip</button>
            <div class="shop-timer"><div id="shopTimerBar" class="shop-timer-bar"></div></div>
          </div>
          <div id="hp" class="hp"></div>
        </div>
      </main>

      <div class="box">
        <label>recent runs — how far the descent got</label>
        <div id="history" class="history"></div>
      </div>

      <div class="box">
        <label>feitos — o que esta máquina já conseguiu</label>
        <div id="achievements" class="achievements"></div>
      </div>

      <p class="note">
        Dimmed tiles are what the bot <em>remembers</em>, not what it can see —
        monsters there may have moved.
      </p>
    </div>

    <aside class="panel">
      <div class="chips">
        <span id="xpEarned"></span>
        <span id="xpRate"></span>
        <span id="steps"></span>
        <span id="kills"></span>
        <span id="damage" title="the damage die one blow rolls over: xp + weapons, floor raised by dmgMin. A blow still misses 1 turn in 6."></span>
        <span id="coins" title="xpEarned/turn this floor × 10, rounded — spent in the shop between runs"></span>
      </div>

      <div class="field">
        <label>carrying</label>
        <div id="inventory" class="inventory"></div>
      </div>

      <div id="debugInfo" class="debug-info"></div>

      <footer>
        <span id="run"></span>
        <span id="tally"></span>
        <span id="seed" class="seed"></span>
      </footer>
    </aside>
  </div>

</div>

<script type="module">
  import { start } from './src/ui/spectator.js';
  start();
</script>
</body>
</html>
