<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogulidle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header>
    <h1>Rogulidle</h1>
    <div class="controls">
      <!-- WHO THIS SAVE BELONGS TO, and the button that changes it. It is
           first in the row because it answers "whose game am I looking at"
           before any control offers to change what happens in it. -->
      <button id="player" type="button" title="trocar de jogador"></button>
      <button id="lab" type="button">🧪 lab</button>
      <button id="playPause" type="button">⏸ pause</button>
      <button id="speed" type="button">0.5×</button>
      <button id="debug" type="button">🔎 debug</button>
      <button id="resetSession" type="button">↻ reset</button>
    </div>
  </header>

  <!-- Three columns, and the board is the middle one. The two flanks are
       equal fractions, so the simulation stays centred on the page whether
       the lab is open or shut — which is the whole reason this is a grid and
       not the flex row it used to be. -->
  <div class="lab">
    <div class="side">
      <!-- WHO IS PLAYING, one block: the choice and what it means. Outside
           #dials on purpose — the dials hide, and the most important control
           on the page must not hide with them. -->
      <div id="roster" class="roster"></div>
      <div class="dials" id="dials" hidden></div>
      <!-- THE SHOP'S ORDER, outside the drawer for the same reason the
           buttons are: `.dials` scrolls at 70vh, and in dev mode it holds
           thirty rows of map dials — a control buried under all of them is
           one nobody finds. Not a dial (src/ui/shop-order.js), but it wears
           the dials' own classes because it belongs to that panel. -->
      <div class="dials-extra" id="shopOrder" hidden></div>
      <!-- The panel's buttons, OUTSIDE the scrolling drawer above. `.dials`
           caps at 70vh and scrolls, so buttons inside it sat below thirty
           rows of sliders. Only dev mode puts anything here now ("salvar
           como padrão") — a dial edit applies to the run by itself, so the
           "reiniciar" button it used to hold is gone. -->
      <div class="dial-buttons-bar" id="dialButtons" hidden></div>
    </div>

    <div class="middle">
      <div class="box box-top">
        <label>feitos — o que esta máquina já conseguiu</label>
        <div id="achievements" class="achievements"></div>
      </div>

      <main>
        <div id="stage" class="stage">
          <!-- Above the board and inside its frame, the mirror of the hp bar
               below it: the floor in the middle, the coins at the right edge.
               The coin chip used to be the sixth chip in the right rail,
               400px from the hero; it is the one number that shows the
               game's rule forming turn by turn, so it lives where the eye
               already is (owner, 2026-09-03). -->
          <div class="floor-bar">
            <span id="floor" class="floor-label"></span>
            <span id="coins" class="coin-hud" title="🪙 bancado nesta run, e +N = a projeção da travessia atual: xp ÷ turnos × 20, arredondado — o que a travessia vai pagar se terminar agora"></span>
          </div>
          <div id="grid" class="grid"></div>
          <!-- The boss bar. Over the board rather than beside it: it only
               exists while one creature is awake, and a slot in the HUD that
               is empty all run would cost more than it says. -->
          <div id="bossBar" class="boss-bar" hidden>
            <div class="boss-bar-name"></div>
            <div class="boss-bar-hp"></div>
          </div>
          <div id="summary" class="summary">
            <div id="summaryTitle" class="summary-title"></div>
            <div id="summaryBody"></div>
          </div>
          <div id="coinPopup" class="coin-popup"></div>
          <div id="shop" class="summary">
            <div class="summary-title">shop</div>
            <div id="shopBalance" class="shop-balance"></div>
            <div id="shopItems" class="shop-items"></div>
            <button id="shopSkip" type="button">skip</button>
            <div class="shop-timer"><div id="shopTimerBar" class="shop-timer-bar"></div></div>
          </div>
          <div id="hp" class="hp"></div>
          <!-- Estamina: o orçamento de turnos da travessia, drenando. O bot
               não lê este número — a barra é informação do jogador. -->
          <div id="stamina" class="hp" title="estamina"></div>
        </div>
      </main>

      <div class="box">
        <label>recent runs — how far the descent got</label>
        <div id="history" class="history"></div>
      </div>

      <p class="note">
        Dimmed tiles are what the bot <em>remembers</em>, not what it can see —
        monsters there may have moved.
      </p>
    </div>

    <!-- THE RIGHT RAIL, one grid item holding three stacked blocks.
         They used to be three direct children of .lab pinned to the third
         column, which put each one in its own grid ROW — and row 1 is as
         tall as the middle column, so everything under the stats landed
         below the whole board instead of beside it. A wrapper is what makes
         them stack against the numbers rather than against the page. -->
    <div class="rail">

    <aside class="panel">
      <div class="chips">
        <span id="steps"></span>
        <span id="kills"></span>
        <span id="damage" title="the damage die one blow rolls over: xp + weapons, floor raised by dmgMin. A blow still misses 1 turn in 6."></span>
      </div>

      <div class="field">
        <label>carrying</label>
        <div id="inventory" class="inventory"></div>
      </div>

      <div id="debugInfo" class="debug-info"></div>

      <footer>
        <span id="run"></span>
        <span id="tally"></span>
        <span id="seed" class="seed"></span>
      </footer>
    </aside>

    <!-- THE MAP'S DIALS, under the numbers rather than in the drawer on the
         left. The left drawer is the BOT — what this run is — and the map is
         the dungeon those runs happen in; two different questions were
         reading as one long form when they shared a column. Populated by
         dials.js through its `mounts`; stays empty outside ?dev=1, which is
         why it is hidden until something lands in it. -->
    <!-- THE WATCHING, not the dungeon: which floor the run starts on. Above
         the map's panel because it is a different question — everything in
         that one describes what a floor IS, this decides which you are
         shown. -->
    <aside id="simDials" class="panel map-dials" hidden></aside>

    <aside id="mapDials" class="panel map-dials" hidden></aside>

    <aside id="highscores" class="panel highscores"></aside>

    </div>
  </div>

</div>

<!-- THE NAME GATE (src/ui/player.js). Outside .app and fixed over the whole
     page: it is shown once, before the first run is ever built, because
     until there is a name there is no save to write into. -->
<div id="playerGate" class="player-gate" hidden></div>

<script type="module">
  import { start } from './src/ui/spectator.js';
  start();
</script>
</body>
</html>
