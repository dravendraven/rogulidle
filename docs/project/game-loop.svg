<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img">
<title>Rogulidle game loop with tier ladder</title>
<desc>Within one day, idle runs earn coin, coin buys one node in the hero's choice tree, and each purchase locks the day and moves the hero closer to the power cap. In the evening the day's nerf is announced. Below the cap the attempt is optional and the player may wait, keeping the right to choose the day. At the cap the attempt is forced and the nerf is hidden. An attempt either fails, resetting the tree while the tier stays, or wins and advances one step up the tier ladder. Tiers reached, heroes unlocked and themes seen never reset.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.dash{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.lbl{font-size:12px;fill:#5F5E5A}
</style>
</defs>

<rect x="0" y="0" width="680" height="680" rx="8" fill="#FDFCFA"/>

<rect x="90" y="40" width="550" height="116" rx="8" class="dash"/>
<text class="lbl" x="106" y="62">One day — repeats until evening</text>

<rect x="110" y="76" width="155" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="188" y="100" text-anchor="middle" fill="#444441">Idle runs</text>
<text class="ts" x="188" y="118" text-anchor="middle" fill="#5F5E5A">down ten, back up</text>

<rect x="285" y="76" width="155" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="363" y="100" text-anchor="middle" fill="#444441">Coin</text>
<text class="ts" x="363" y="118" text-anchor="middle" fill="#5F5E5A">only a clear pays</text>

<rect x="460" y="76" width="155" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="538" y="100" text-anchor="middle" fill="#3C3489">Buy one node</text>
<text class="ts" x="538" y="118" text-anchor="middle" fill="#534AB7">locks day, nears cap</text>

<path class="arr" d="M267 104 L281 104" marker-end="url(#arrow)"/>
<path class="arr" d="M442 104 L456 104" marker-end="url(#arrow)"/>
<path class="arr" d="M365 158 L365 180" marker-end="url(#arrow)"/>

<rect x="195" y="184" width="340" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="365" y="208" text-anchor="middle" fill="#3C3489">Evening — today's nerf</text>
<text class="ts" x="365" y="226" text-anchor="middle" fill="#534AB7">only nerfs, never buffs</text>

<path class="arr" d="M300 242 L275 262" marker-end="url(#arrow)"/>
<path class="arr" d="M430 242 L455 262" marker-end="url(#arrow)"/>

<rect x="180" y="264" width="170" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="265" y="285" text-anchor="middle" fill="#444441">Below cap</text>
<text class="ts" x="265" y="302" text-anchor="middle" fill="#5F5E5A">nerf shown, may wait</text>

<rect x="380" y="264" width="170" height="48" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="465" y="285" text-anchor="middle" fill="#712B13">At cap</text>
<text class="ts" x="465" y="302" text-anchor="middle" fill="#993C1D">nerf hidden, forced</text>

<path class="arr" d="M220 312 L182 338" marker-end="url(#arrow)"/>
<path class="arr" d="M310 312 L418 338" marker-end="url(#arrow)"/>
<path class="arr" d="M480 312 L495 338" marker-end="url(#arrow)"/>

<rect x="90" y="342" width="170" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="175" y="363" text-anchor="middle" fill="#444441">Wait</text>
<text class="ts" x="175" y="380" text-anchor="middle" fill="#5F5E5A">keeps the choice</text>

<rect x="400" y="342" width="190" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="495" y="363" text-anchor="middle" fill="#3C3489">Attempt</text>
<text class="ts" x="495" y="380" text-anchor="middle" fill="#534AB7">one shot, irreversible</text>

<path class="arr" d="M450 392 L402 416" marker-end="url(#arrow)"/>
<path class="arr" d="M540 392 L566 416" marker-end="url(#arrow)"/>

<rect x="300" y="420" width="170" height="48" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="385" y="441" text-anchor="middle" fill="#712B13">Fail</text>
<text class="ts" x="385" y="458" text-anchor="middle" fill="#993C1D">tree resets, tier stays</text>

<rect x="500" y="420" width="140" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="570" y="441" text-anchor="middle" fill="#085041">Win</text>
<text class="ts" x="570" y="458" text-anchor="middle" fill="#0F6E56">tier advances</text>

<path class="arr" d="M175 392 L175 490"/>
<path class="arr" d="M385 468 L385 490 L60 490 L60 106 L86 106" marker-end="url(#arrow)"/>
<path class="arr" d="M570 470 L570 496" marker-end="url(#arrow)"/>

<rect x="40" y="500" width="580" height="100" rx="8" class="dash"/>
<text class="lbl" x="56" y="522">Tier ladder — same idle difficulty, harder challenge</text>

<rect x="60" y="534" width="165" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="142" y="556" text-anchor="middle" fill="#085041">Tier 1</text>
<text class="ts" x="142" y="574" text-anchor="middle" fill="#0F6E56">8 nodes, 4 heroes</text>

<rect x="245" y="534" width="165" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="327" y="556" text-anchor="middle" fill="#085041">Tier 2</text>
<text class="ts" x="327" y="574" text-anchor="middle" fill="#0F6E56">10 nodes, new shop</text>

<rect x="430" y="534" width="165" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="512" y="556" text-anchor="middle" fill="#085041">Tier 5+</text>
<text class="ts" x="512" y="574" text-anchor="middle" fill="#0F6E56">24 nodes, plateau</text>

<path class="arr" d="M227 560 L241 560" marker-end="url(#arrow)"/>
<path class="arr" d="M412 560 L426 560" marker-end="url(#arrow)"/>
<path class="arr" d="M620 550 L652 550 L652 106 L644 106" marker-end="url(#arrow)"/>

<rect x="40" y="620" width="580" height="40" rx="4" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="th" x="60" y="645" fill="#444441">Never resets — tiers reached, heroes unlocked, themes seen</text>
</svg>
