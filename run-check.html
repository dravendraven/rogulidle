<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogulidle — is this any good?</title>
<style>
  :root { --bg:#101216; --panel:#171a21; --line:#262b35; --text:#d8dee9; --dim:#7a8595;
          --faint:#5b6472; --good:#8ce99a; --warn:#ffd8a8; --bad:#ff8787; --accent:#74c0fc;
          --success:#cfe6ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem 1rem 4rem; background:var(--bg); color:var(--text);
         font:13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .app { max-width: 960px; margin: 0 auto; }
  h1 { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; margin:0 0 .3rem; }
  h2 { font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; margin:0 0 .2rem; color:var(--accent); }
  h3 { font-size:.85rem; letter-spacing:.03em; margin:0 0 .2rem; color:var(--text); }
  p { max-width:80ch; }
  .lede, .note { color:var(--faint); font-size:11.5px; max-width:80ch; }
  .lede { margin:0 0 1.2rem; font-size:13px; }
  fieldset { border:1px solid var(--line); border-radius:8px; background:var(--panel);
             margin:0 0 .9rem; padding:.7rem 1rem 1rem; }
  legend { color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:0 .4rem; }
  label { display:block; color:var(--dim); font-size:11px; margin:.5rem 0 .2rem; }
  input { font:inherit; color:var(--text); background:#12151b; border:1px solid var(--line);
    border-radius:5px; padding:.35rem .5rem; width:100%; }
  .row { display:flex; gap:.9rem; flex-wrap:wrap; }
  .row > div { flex:1 1 130px; }
  button { font:inherit; color:var(--text); background:#20242d; border:1px solid var(--line);
    border-radius:6px; padding:.45rem 1rem; cursor:pointer; margin-right:.5rem; }
  button.primary { background:#25333f; border-color:#33495c; color:#cfe6ff; }
  button[disabled] { opacity:.45; cursor:default; }
  #status { color:var(--dim); margin:.7rem 0 1rem; }
  table { border-collapse:collapse; width:100%; font-size:12px; margin:.3rem 0 .5rem; }
  th, td { text-align:right; padding:.25rem .5rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; }
  section.level { border:1px solid var(--line); border-radius:10px; background:#131620;
    padding:1rem 1.2rem 1.2rem; margin:0 0 1.2rem; }
  .grid { display:grid; grid-template-columns:1.1fr 1fr 1fr 1fr; gap:.8rem; margin-top:.6rem; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr 1fr; } }
  .cell { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:.7rem .8rem; }
  .cell.success { border-color:#33495c; background:#182231; }
  .kind { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .cell.success .kind { color:var(--success); }
  .big { font-size:1.35rem; font-weight:600; margin:.2rem 0; }
  .cell.success .big { font-size:1.55rem; }
  .meaning { color:var(--dim); font-size:11px; margin:.15rem 0 0; }
  .direction { color:var(--faint); font-size:10px; margin:.1rem 0 0; }
  .ok { color:var(--good); } .no { color:var(--bad); } .meh { color:var(--warn); }
  .flag { color:var(--bad); font-size:11.5px; margin:.5rem 0 0; padding:.4rem .6rem;
    background:rgba(255,135,135,.08); border:1px solid rgba(255,135,135,.3); border-radius:5px; grid-column:1/-1; }
  .flag.none { color:var(--good); background:rgba(140,233,154,.06); border-color:rgba(140,233,154,.25); grid-column:1/-1; }
  .subnote { grid-column:1/-1; }
  .lede2 { color:var(--faint); font-size:11px; margin:0 0 .3rem; }
  details summary { cursor:pointer; color:var(--dim); font-size:11px; }
  .smallprint { color:var(--faint); font-size:10.5px; margin-top:.5rem; }
</style>
</head>
<body>
<div class="app">

<h1>Is this any good?</h1>

<fieldset>
  <legend>run</legend>
  <div class="row">
    <div><label>floor samples</label><input id="floorRuns" type="number" value="6"></div>
    <div><label>descents</label><input id="descentRuns" type="number" value="2"></div>
    <div><label>seed base</label><input id="firstSeed" type="number" value="500000"></div>
  </div>
</fieldset>

<button id="run" class="primary">Check</button>
<p id="status">idle</p>
<div id="out"></div>

<script type="module">
import { rewardShape, capacityShape, builtShape, coinShape } from './src/analysis/observed-ruler.js';
import { descentCheck } from './src/analysis/clustering.js';
import { floorPlan, LEVELS } from './src/sim/dungeon.js';
import { PLAYER_HP } from './src/sim/balance.js';

const $ = (id) => document.getElementById(id);
const f = (x, d = 1) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : x.toFixed(d));
const pct = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : Math.round(x * 100) + '%');
function median(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function cell(kind, label, big, hint) {
  const c = el('div', `cell${kind === 'success' ? ' success' : ''}`);
  c.append(el('div', null, `<b style="font-size:11px">${label}</b>`));
  c.append(el('div', 'big', big));
  if (hint) c.append(el('div', 'direction', hint));
  return c;
}

function levelSection(title, lede, cells, flagNode) {
  const s = el('section', 'level');
  s.append(el('h2', null, title));
  if (lede) s.append(el('p', 'lede2', lede));
  const grid = el('div', 'grid');
  for (const c of cells) grid.append(c);
  if (flagNode) grid.append(flagNode);
  s.append(grid);
  return s;
}

function render(reward, counts, dc, cap, sonda, coins) {
  $('out').innerHTML = '';

  // ***** Product *****
  const depths = dc.depths;
  const depthList = depths.join(', ');
  const finCls = dc.finishRate >= 0.15 && dc.finishRate <= 0.35 ? 'ok' : 'meh';

  const productCells = [
    cell('success', 'median depth', `${f(dc.medianDepth, 1)}/${LEVELS}`, `depths: ${depthList}`),
    cell('health', 'finishes', `<span class="${finCls}">${pct(dc.finishRate)}</span>`, `${dc.cleared}/${dc.runs}`),
    cell('health', 'turns between events', f(dc.eventGapMedian, 0), `n=${dc.eventGapN}`),
    cell('health', 'spread of depths', `±${f(dc.depthSpread, 1)}`),
  ];
  $('out').append(levelSection('Product', null, productCells));

  // ***** Map *****
  const first = reward[0].challenge.mean;
  const last = reward[reward.length - 1].challenge.mean;
  const drops = [];
  reward.forEach((r, i) => {
    if (i > 0 && r.challenge.mean < reward[i - 1].challenge.mean) drops.push(r.level);
  });
  // hp spent as a multiple of a hero's EXPECTED effectiveHp (hp + armour)
  // on arrival, not flat PLAYER_HP — hp never grows, only armour does.
  // Source: capacityShape({ suppressDeath: true, startHero: null }) — sonda,
  // real base, death suppressed so deep floors aren't survivor-biased.
  const capByLevel = new Map(cap.rows.map((r) => [r.level, r.effectiveHp.mean]));
  const expectedHp = (level) => capByLevel.get(level) ?? PLAYER_HP;
  const lethal = [];
  reward.forEach((r) => {
    const ratio = r.challenge.mean / expectedHp(r.level);
    if (ratio >= 1) lethal.push({ level: r.level, ratio });
  });
  const costTable = el('table');
  costTable.innerHTML = '<thead><tr><th>floor</th>' + reward.map((r) => `<th>${r.level}</th>`).join('') + '</tr></thead>'
    + '<tbody><tr><td>hp spent</td>' + reward.map((r, i) => {
      const cheaper = i > 0 && r.challenge.mean < reward[i - 1].challenge.mean;
      return `<td class="${cheaper ? 'no' : ''}">${f(r.challenge.mean, 1)}</td>`;
    }).join('') + '</tr>'
    + '<tr><td class="direction">× expected hp+armour</td>' + reward.map((r) => {
      const ratio = r.challenge.mean / expectedHp(r.level);
      return `<td class="direction ${ratio >= 1 ? 'no' : ''}">${f(ratio, 1)}×</td>`;
    }).join('') + '</tr>'
    + '<tr><td class="direction">expected hp+armour</td>' + reward.map((r) => `<td class="direction">${f(expectedHp(r.level), 1)}</td>`).join('') + '</tr></tbody>';
  const costCard = el('div');
  costCard.append(costTable);
  const flagParts = [];
  if (drops.length) {
    flagParts.push(el('p', 'flag', `Cheaper than floor before: ${drops.map((l) => l).join(', ')}`));
  }
  if (lethal.length) {
    flagParts.push(el('p', 'flag', `Over hp+armour budget: ${lethal.map((x) => `${x.level} (${f(x.ratio, 1)}×)`).join(', ')}`));
  }
  const flagNode = el('div', 'subnote');
  for (const p of flagParts) flagNode.append(p);

  const creatureRow = counts.map((c, i) => {
    const drop = i > 0 && c < counts[i - 1];
    return `<td class="${drop ? 'no' : ''}">${c}</td>`;
  }).join('');
  const xpRow = reward.map((r) => `<td>${f(r.meanXp, 1)}</td>`).join('');
  const creatureTable = `<table><thead><tr><th>floor</th>${counts.map((_, i) => `<th>${i + 1}</th>`).join('')}</tr></thead>`
    + `<tbody><tr><td>count</td>${creatureRow}</tr><tr><td>mean xp</td>${xpRow}</tr></tbody></table>`;

  const spreadTable = `<table><thead><tr><th>floor</th>${reward.map((r) => `<th>${r.level}</th>`).join('')}</tr></thead>`
    + `<tbody><tr><td>spread</td>${reward.map((r) => `<td>${pct(r.challenge.cv)}</td>`).join('')}</tr></tbody></table>`;

  const lootTable = `<table><thead><tr><th>floor</th>${reward.map((r) => `<th>${r.level}</th>`).join('')}</tr></thead>`
    + `<tbody><tr><td>loot ÷ cost</td>${reward.map((r) => `<td>${pct(r.reward.mean / r.challenge.mean)}</td>`).join('')}</tr></tbody></table>`;

  const mapCells = [
    cell('success', `cost, floor ${LEVELS}÷1`, `${f(last / first, 1)}×`),
    cell('health', 'creatures',
      `${counts[0]} → ${counts[counts.length - 1]} <span style="font-size:.85rem;color:var(--faint)">(xp ${f(reward[0].meanXp, 1)} → ${f(reward[reward.length - 1].meanXp, 1)})</span>`),
    cell('health', 'spread within floor', `${pct(reward[0].challenge.cv)} → ${pct(reward[reward.length - 1].challenge.cv)}`),
    cell('health', 'loot / cost',
      `${pct(reward.reduce((s, r) => s + r.reward.mean, 0) / reward.reduce((s, r) => s + r.challenge.mean, 0))} avg`),
  ];
  const mapSection = levelSection('Map', null, mapCells, flagNode);
  const tables = el('div', 'subnote');
  tables.style.marginTop = '.7rem';
  tables.append(el('h3', null, 'cost per floor'), costTable,
    el('h3', null, 'creatures per floor'), el('div', null, creatureTable),
    el('h3', null, 'spread within a floor'), el('div', null, spreadTable),
    el('h3', null, 'loot vs cost, per floor'), el('div', null, lootTable));
  mapSection.querySelector('.grid').append(tables);
  $('out').append(mapSection);

  // ***** Bot *****
  // Same real mortal hero, same map, dumb sonda policy instead of the bot
  // (builtShape vs descentCheck) — isolates bot skill from map difficulty,
  // which damage-per-kill could not (deeper floors hit harder regardless
  // of how well anyone plays). Median depth, not finish rate: finish rate
  // is 0/0-noisy at the small samples this page uses, depth isn't.
  const sondaDepth = median(sonda.depths);
  const botDepth = dc.medianDepth;
  const botCells = [
    cell('success', 'depth, bot÷sonda', `${f(botDepth / (sondaDepth || 1), 2)}×`,
      `bot ${f(botDepth, 1)} / sonda ${f(sondaDepth, 1)}`),
    cell('health', 'reversal rate', pct(dc.reversalRate)),
    cell('health', 'turns per floor', f(dc.turnsPerFloor, 0)),
    cell('health', 'lost fights started',
      `${dc.lostFightsStarted} <span style="font-size:.85rem;color:var(--faint)">/ ${dc.fightsStarted}</span>`),
  ];
  $('out').append(levelSection('Bot', null, botCells));

  // Theoretical coins: round(xp/turn × 10) per floor, summed per run, mean
  // across runs. Sonda A/B are 10 independent floor draws (never connected
  // — same as challenge/reward); bot is a real connected descent.
  const coinsDiv = el('div');
  coinsDiv.append(el('h3', null, 'theoretical coins (xp/turn × 10, per run)'));
  coinsDiv.append(el('div', null,
    `<table><thead><tr><th></th><th>sonda A</th><th>sonda B</th><th>bot</th></tr></thead>`
    + `<tbody><tr><td>mean/run</td><td>${f(coins.coinsA.mean, 1)}</td><td>${f(coins.coinsB.mean, 1)}</td><td>${f(dc.meanCoins, 1)}</td></tr></tbody></table>`));
  $('out').append(coinsDiv);
}

$('run').addEventListener('click', async () => {
  $('run').disabled = true;
  $('out').innerHTML = '';
  const started = performance.now();
  try {
    const floorRuns = Number($('floorRuns').value);
    const descentRuns = Number($('descentRuns').value);
    const firstSeed = Number($('firstSeed').value);

    $('status').textContent = 'clearing floors (map numbers)…';
    await new Promise((r) => setTimeout(r, 20));
    const reward = rewardShape({ runs: floorRuns, firstSeed });
    const counts = Array.from({ length: LEVELS }, (_, i) => floorPlan(i + 1).monsters);

    $('status').textContent = 'playing full descents with the real bot (product + bot numbers)…';
    await new Promise((r) => setTimeout(r, 20));
    const dc = descentCheck({ runs: descentRuns, firstSeed: firstSeed + 700000 });

    $('status').textContent = 'playing full descents with the sonda, death suppressed (map difficulty)…';
    await new Promise((r) => setTimeout(r, 20));
    // Its own, larger, non-configurable sample: this descent is cheap
    // (~0.3s/run, no danger-field/pricing math, unlike the bot) and the
    // number it feeds is noisy at small n in a specific way worth avoiding
    // — the death-suppressed probe often sits at exactly 0 hp+armour for
    // stretches (no regen by default), so 2-3 samples can average to a
    // near-zero that is real noise, not the actual expectation. 15 tames
    // it for a few seconds instead of tying it to the expensive bot dial.
    const cap = capacityShape({
      runs: 15, firstSeed: firstSeed + 1400000, suppressDeath: true, startHero: null,
    });

    $('status').textContent = 'playing full descents with the sonda, mortal (bot vs sonda)…';
    await new Promise((r) => setTimeout(r, 20));
    // Same cheap sonda descent as capacityShape above, mortal this time
    // (no death suppression) — the real baseline "depth, bot÷sonda" needs.
    const sonda = builtShape({ runs: 15, firstSeed: firstSeed + 2100000 });

    $('status').textContent = 'pricing xp/turn (theoretical coins)…';
    await new Promise((r) => setTimeout(r, 20));
    // Isolated floors like rewardShape, not a connected descent — cheap.
    const coins = coinShape({ runs: floorRuns, firstSeed: firstSeed + 2800000 });

    render(reward, counts, dc, cap, sonda, coins);
    $('status').textContent = `done in ${((performance.now() - started) / 1000).toFixed(1)}s`;
  } catch (error) {
    $('status').textContent = 'failed: ' + error.message;
    console.error(error);
  } finally {
    $('run').disabled = false;
  }
});
</script>
</div>
</body>
</html>
